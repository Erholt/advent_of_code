name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Node version
        run: node --version

      - name: Run tests (parallel if supported)
        run: |
          if node --help 2>&1 | grep -q -- '--jobs'; then
            echo "Node supports --jobs, running with parallel jobs"
            node --test --jobs=auto javascript
          else
            echo "Node does not support --jobs, running without jobs"
            node --test javascript
          fi
